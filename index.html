<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Networking Academy PRO — Visual Engineering & Interactive Network Sandbox</title>
  <meta name="description" content="A professional, visual, zero-buzzword interactive networking engineering academy for modern developers with hardware anatomy, packet animations, and an in-browser Linux terminal." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-theme="dark">

  <!-- Top Application Bar -->
  <header class="app-header">
    <div class="brand" id="brand-home-btn" style="cursor:pointer;" title="Return to Home">
      <div class="brand-emblem">⚡</div>
      <div class="brand-text">
        <h1>Networking Academy <span class="pro-badge">PRO</span></h1>
        <span class="brand-sub">Visual Hardware Engineering & Interactive Protocol Sandbox</span>
      </div>
    </div>

    <!-- Live System Telemetry Clock -->
    <div class="header-clock-container" id="header-live-clock">
      <span class="clock-live-pulse"></span>
      <span class="clock-local">00:00:00</span>
      <span class="clock-utc">(00:00:00 UTC)</span>
    </div>

    <div class="header-right">
      <div class="xp-badge-header" id="header-user-xp">120 XP</div>
      <div class="progress-tracker">
        <span>Progress:</span>
        <div class="progress-track-bg">
          <div class="progress-fill" id="curriculum-progress-bar"></div>
        </div>
        <strong id="curriculum-progress-pct">0%</strong>
      </div>

      <button id="btn-toggle-theme" class="btn-header">☀️ Light Mode</button>
      <button id="btn-toggle-terminal" class="btn-header btn-term-toggle">
        Hide Terminal ➔
      </button>
    </div>
  </header>

  <!-- Main 3-Column Sizable Side-by-Side Workspace -->
  <div class="app-layout" id="main-app-layout">
    
    <!-- 1. Left: Sizable Sidebar Navigation -->
    <aside class="sidebar" id="app-sidebar">
      <div class="sidebar-heading">Curriculum Navigation</div>
      <nav class="nav-modules" id="nav-modules-list">
        <!-- Dynamically rendered Home + Modules -->
      </nav>
    </aside>

    <!-- Draggable Left Splitter Gutter -->
    <div class="resizer-gutter resizer-left" id="resizer-left" title="Drag to resize sidebar"></div>

    <!-- 2. Center Stage: Reading, Explanations, Home Catalog & Wide Visualizers -->
    <main class="content-area-wrapper" id="app-content-wrapper">
      <div class="main-content" id="module-content-area">
        <!-- Dynamically populated Home or Module sections -->
      </div>
    </main>

    <!-- Draggable Right Splitter Gutter -->
    <div class="resizer-gutter resizer-right" id="resizer-right" title="Drag to resize terminal panel"></div>

    <!-- 3. Right Side: Sizable Interactive Terminal Panel -->
    <aside class="terminal-panel" id="terminal-panel">
      <div id="terminal-mount" style="height: 100%;"></div>
    </aside>

  </div>

  <!-- Application Scripts -->
  <script src="js/data/devices.js"></script>
  <script src="js/data/curriculum.js"></script>
  <script src="js/visualizers/networkSimulationDashboard.js"></script>
  <script src="js/visualizers/packetJourney.js"></script>
  <script src="js/visualizers/layerStack.js"></script>
  <script src="js/visualizers/subnetVisualizer.js"></script>
  <script src="js/visualizers/vlanVisualizer.js"></script>
  <script src="js/visualizers/dnsVisualizer.js"></script>
  <script src="js/visualizers/tcpHandshake.js"></script>
  <script src="js/visualizers/topologyVisualizer.js"></script>
  <script src="js/terminal/networkSimulator.js"></script>
  <script src="js/terminal/challenges.js"></script>
  <script src="js/terminal/terminal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
