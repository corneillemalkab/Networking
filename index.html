<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Networking Academy — Level 0 to Advanced Fundamentals</title>
  <meta name="description" content="A warm, visual, and zero-buzzword interactive networking academy for new engineers with real packet animations and in-browser terminal practice." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-theme="dark">

  <!-- Top Application Bar -->
  <header class="app-header">
    <div class="brand">
      <span class="brand-icon">⚡</span>
      <div class="brand-text">
        <h1>Networking Academy <span style="font-weight: normal; opacity: 0.7;">| Level 0 to 1</span></h1>
        <span class="brand-sub">Visual Systems Engineering & Interactive Network Sandbox</span>
      </div>
    </div>

    <div class="header-right">
      <div class="progress-tracker">
        <span>Curriculum Progress:</span>
        <div class="progress-track-bg">
          <div class="progress-fill" id="curriculum-progress-bar"></div>
        </div>
        <strong id="curriculum-progress-pct">0%</strong>
      </div>

      <button id="btn-toggle-theme" class="btn-header">☀️ Light Mode</button>
      <button id="btn-toggle-terminal" class="btn-header btn-term-toggle">
        Hide Terminal ➔
      </button>
    </div>
  </header>

  <!-- Main 3-Column Side-by-Side Workspace -->
  <div class="app-layout">
    
    <!-- Left: Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-heading">Curriculum Modules</div>
      <nav class="nav-modules" id="nav-modules-list">
        <!-- Dynamically rendered modules -->
      </nav>
    </aside>

    <!-- Center Stage: Reading, Explanations & Wide Visualizers -->
    <main class="content-area-wrapper">
      <div class="main-content" id="module-content-area">
        <!-- Dynamically populated module sections & wide visualizers -->
      </div>
    </main>

    <!-- Right Side: Side-by-Side Interactive Terminal Panel -->
    <aside class="terminal-panel" id="terminal-panel">
      <div id="terminal-mount" style="height: 100%;"></div>
    </aside>

  </div>

  <!-- Application Scripts -->
  <script src="js/data/curriculum.js"></script>
  <script src="js/visualizers/packetJourney.js"></script>
  <script src="js/visualizers/layerStack.js"></script>
  <script src="js/visualizers/subnetVisualizer.js"></script>
  <script src="js/visualizers/vlanVisualizer.js"></script>
  <script src="js/visualizers/dnsVisualizer.js"></script>
  <script src="js/visualizers/tcpHandshake.js"></script>
  <script src="js/visualizers/topologyVisualizer.js"></script>
  <script src="js/terminal/networkSimulator.js"></script>
  <script src="js/terminal/challenges.js"></script>
  <script src="js/terminal/terminal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
